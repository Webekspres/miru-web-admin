name: MIRU Web Admin CI (Staging)

on:
  push:
    branches: [stage, staging]
  pull_request:
    branches: [stage, staging]

jobs:
  ci:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Web admin lint
        run: bun run lint

      - name: Web admin tests
        run: bun run test

      - name: Web admin build
        env:
          NEXT_PUBLIC_API_URL: https://api.dev.mirubanksampah.id
        run: bun run build
